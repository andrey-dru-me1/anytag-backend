[package]
name = "anytag-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
diesel = { version = "2.3.11", default-features = false, features = ["chrono"] }
chrono = { version = "0.4.38", features = ["serde"] }
axum = { version = "~0.8.8", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
argon2 = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
zxcvbn = "3.1.1"
strum = { version = "0.28.0", features = ["derive"] }
bon = "3.9.3"
email_address = "0.2.9"
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.143.0", features = ["behavior-version-latest"] }
sha2 = "0.11.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["webp", "jpeg", "png"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.25.0", features = ["v4"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
