---
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

  DB_TYPE: postgres
  DB_HOST: localhost
  DB_PORT: 5432

  DB_USER: anytag_ci
  DB_PASS: ${{ secrets.DB_PASS }}
  DB_NAME: anytag_ci

  S3_BASE_URL: http://localhost:8333
  S3_BUCKET: anytag-ci-bucket
  AWS_ACCESS_KEY_ID: anytag_ci
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  test-nix:
    name: Test with Nix (Linux)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.17.0

      - name: Show environment info
        run: |
          nix develop --command bash -c "
            rustc --version
            cargo --version
            diesel --version
          "

      - name: Start PostgreSQL docker service
        run: nix develop --command docker compose up -d postgres

      - name: Start SeaweedFS S3 docker service
        run: nix develop --command docker compose up -d seaweed

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Wait for SeaweedFS S3
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -m 2 http://localhost:8333/; then
              echo "SeaweedFS is ready"
              break
            fi
            echo "Waiting for SeaweedFS... ($i/30)"
            sleep 1
          done

      - name: Run migrations
        run: nix develop --command diesel migration run

      - name: Build project
        run: nix develop --command cargo build

      - name: Run tests
        run: nix develop --command cargo test

      - name: Check formatting
        run: nix develop --command cargo fmt -- --check

      - name: Run clippy
        run: nix develop --command cargo clippy -- -D warnings


  # Build with Nix (production)
  build-nix:
    name: Build with Nix
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [test-nix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.17.0

      - name: Build with Nix
        run: |
          # Build the project using Nix
          nix build .#default 2>/dev/null \
            || echo "No flake.nix package defined"

          # Alternative: build with cargo in nix develop
          nix develop --command cargo build --release

          echo "Build completed successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anytag-backend-binary
          path: target/release/anytag-backend
          if-no-files-found: ignore
