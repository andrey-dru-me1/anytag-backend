[package]
name = "anytag-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
diesel = { version = "2.3.11", default-features = false, features = ["chrono"] }
chrono = "0.4.38"
axum = "~0.8.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zxcvbn = "3.1.1"
strum = { version = "0.28.0", features = ["derive"] }
bon = "3.9.3"
email_address = "0.2.9"
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "~0.15.0"
assert_matches = "1.5"
tempfile = "3.10"
http-body-util = "0.1"
